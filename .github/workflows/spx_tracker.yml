name: SPX Express Tracker

on:
  schedule:
    # 每 15 分钟运行一次 (UTC 时间)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 恢复状态缓存文件
        uses: actions/cache@v4
        with:
          path: last_status.txt
          # 动态 key：使得每次运行都能读取到上一次保存的 cache
          key: spx-status-cache-${{ github.run_id }}
          restore-keys: |
            spx-status-cache-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行 SPX 追踪脚本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
